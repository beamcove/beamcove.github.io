<!doctype html>
<!--
    Source for public/assets/apple-touch-icon.png (180×180). The favicon's
    cursor and ink block on a full black square: iOS rounds the corners itself.
    Not part of the site build; regenerate with `npm run social-card`.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Touch icon</title>
        <style>
            html,
            body {
                margin: 0;
                width: 180px;
                height: 180px;
                overflow: hidden;
            }
            svg {
                display: block;
            }
        </style>
    </head>
    <body>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="180" height="180">
            <rect width="64" height="64" fill="#08090b" />
            <rect x="14" y="10" width="20" height="40" fill="#c8ff1a" />
            <rect x="28" y="32" width="24" height="22" fill="#ff3d9a" />
            <rect x="28" y="32" width="6" height="18" fill="#ffffa4" />
        </svg>
    </body>
</html>
