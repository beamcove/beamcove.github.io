  </defs>
  <rect width="64" height="64" rx="16" fill="#f7f6f2"/>
  <polygon points="14,10 50,10 32,46" fill="#0a6cbd"/>
  <rect x="10" y="36" width="44" height="14" rx="7" fill="#ff4a3d"/>
  <rect x="10" y="36" width="44" height="14" rx="7" fill="#2a3a8c" clip-path="url(#tri)"/>
</svg>
